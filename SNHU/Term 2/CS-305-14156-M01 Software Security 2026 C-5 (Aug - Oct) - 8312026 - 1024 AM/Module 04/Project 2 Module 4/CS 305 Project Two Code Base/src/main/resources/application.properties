# =============================================================================
# Artemis Financial - secure transport configuration
# Refactored from the skeleton, which shipped with "????" placeholders and no
# working TLS. HTTP is not served at all: 8443 is HTTPS-only.
# =============================================================================

server.port=8443

# --- TLS keystore ------------------------------------------------------------
# PKCS#12, not the proprietary JKS format (JKS was deprecated in JDK 9 and uses a
# weak password-based MAC). Generated with:
#   keytool -genkeypair -alias artemis -keyalg RSA -keysize 2048 \
#           -sigalg SHA256withRSA -storetype PKCS12 \
#           -keystore artemis-keystore.p12 -validity 365 \
#           -dname "CN=localhost, OU=Global Rain, O=Artemis Financial, L=Manchester, ST=NH, C=US" \
#           -ext "SAN=dns:localhost,ip:127.0.0.1"
server.ssl.enabled=true
server.ssl.key-alias=artemis
server.ssl.key-store=classpath:artemis-keystore.p12
server.ssl.key-store-type=PKCS12
# NOTE: a real deployment reads this from a secrets manager (AWS KMS / HashiCorp
# Vault) or an environment variable, never from a file committed to source
# control. It is inline here only so the self-signed demo keystore is runnable.
server.ssl.key-store-password=${ARTEMIS_KEYSTORE_PASSWORD:artemis2026}

# --- Protocol and cipher restrictions ---------------------------------------
# SSLv3, TLS 1.0 and TLS 1.1 are all deprecated (RFC 8996) and vulnerable to
# POODLE / BEAST style attacks. Only the two modern versions are enabled.
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
# Forward-secret AEAD suites only: no RSA key transport, no CBC, no RC4.
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,\
TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# --- Information disclosure --------------------------------------------------
# Stack traces and internal paths in an error response hand an attacker a free
# map of the application. Suppress everything but the status code.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Do not advertise the servlet container or its version in the Server header.
server.server-header=

# --- Request limits ----------------------------------------------------------
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=8KB

# --- Application -------------------------------------------------------------
artemis.developer-name=Draven Chen

# Spring Security would otherwise print a random generated password on startup.
logging.level.org.springframework.security=INFO
